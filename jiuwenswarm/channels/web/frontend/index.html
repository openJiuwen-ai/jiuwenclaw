<!DOCTYPE html>
<html lang="zh-CN" data-theme="default" data-color-mode="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f9" />
    <title>JiuwenSwarm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Apply the saved preference before React mounts to avoid a theme flash.
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark' || savedTheme === 'system'
          ? savedTheme
          : 'system';
        const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        const colorMode = theme === 'light' || (theme === 'system' && prefersLight)
          ? 'light'
          : 'dark';
        document.documentElement.setAttribute('data-theme', 'default');
        document.documentElement.setAttribute('data-color-mode', colorMode);
      })();
    </script>
  </body>
</html>
