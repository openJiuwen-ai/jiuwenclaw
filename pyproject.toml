[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenclaw"
version = "0.1.10"
description = "JiuwenClaw"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "chromadb>=1.5.0",
    "ruamel.yaml>=0.18.0",
    "lark-oapi>=1.5.3",
    "loguru>=0.7.3",
    "openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@enterprise-dev",
    "pip==26.0.1",
    "virtualenv>=20.29.0",
    "pgvector>=0.4.2",
    "websockets>=12.0",
    "psutil>=7.2.2",
    "aiosqlite>=0.22.1",
    "watchdog>=6.0.0",
    "croniter>=2.0.0",
    "jieba>=0.42",
    "python-telegram-bot>=20.0",
    "discord.py>=2.4.0",
    "dingtalk-stream>=0.24.3",
    "wecom-aibot-sdk>=1.0.5",
    "python-socks>=2.8.1",
    "greenlet>=3.3.2",
    "skillnet-ai==0.0.16",
    "mutagen>=1.47.0",
    "google-genai>=1.68.0",
    "opentelemetry-api>=1.25.0,<=1.42.1",
    "opentelemetry-sdk>=1.25.0,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0,<=1.42.1",
    "json-repair>=0.58.0",
    "trafilatura>=1.6.0",
    # lxml 5.2+ 将 html.clean 拆出；trafilatura/justext 仍依赖 lxml.html.clean
    "lxml_html_clean>=0.4.0",
    # 安全补丁：以下三项为传递依赖的下限约束，仅用于修复已知 CVE
    "lxml>=6.1.0",              # 修复 CVE-2026-41066（默认解析器 XXE，可读取本地文件）
    "pillow>=12.2.0",           # 修复 CVE-2026-40192（FITS 解码器 GZIP 解压炸弹 DoS）
    "python-multipart>=0.0.27", # 修复 CVE-2026-42561（MultipartParser 资源未限分配 DoS）
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-bash>=0.25.0,<0.26.0",
    # 缺乏这些包TestTenantAgentPool无法执行
    "sqlite-vec==0.1.6",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "sqlite-vec==0.1.6",
    "python-json-logger",
    "openjiuwen_deepsearch @ git+https://gitcode.com/openJiuwen/deepsearch.git@enterprise_dev",
    "markdown",
    "jieba3k>=0.35.1",
    "beautifulsoup4>=4.14.3",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4"]
dev = ["pyinstaller>=6.0.0", "pywebview>=5.4"]
tui = ["jiuwenclaw-tui==0.1.10"]
# Same packages as [dependency-groups] test (pip install -e ".[test]")
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.1.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]

[project.scripts]
jiuwenclaw-app = "jiuwenclaw.app:main"
jiuwenclaw-agentserver = "jiuwenclaw.app_agentserver:main"
jiuwenclaw-gateway = "jiuwenclaw.app_gateway:main"
jiuwenclaw-web = "jiuwenclaw.app_web:main"
jiuwenclaw-start = "jiuwenclaw.start_services:main"
jiuwenclaw-init = "jiuwenclaw.init_workspace:main"
jiuwenclaw-desktop = "jiuwenclaw.desktop_app:main"
jiuwenclaw-cli = "jiuwenclaw.app_cli:main"
# jiuwenbox 子项目入口（随 jiuwenclaw wheel 一起安装，见
# docs/windows_sandbox_officeace_integration_design.md §8.1 Q1）。
# jiuwenbox-server 由 jiuwenclaw agent-server 通过 JiuwenBoxRunner 内部
# spawn（python -m uvicorn jiuwenbox.server.app:app），此 console script 供
# 外部/调试场景手动起 jiuwenbox-server 用。
jiuwenbox = "jiuwenbox.cli.jiuwenbox:main"
jiuwenbox-server = "jiuwenbox.server.launcher:main"

[tool.setuptools]
# 入口脚本现在是 jiuwenclaw 包内的一部分，不需要 py-modules
py-modules = []
include-package-data = true
# 把 jiuwenbox 顶包重映射到它的 src-layout 路径（jiuwenbox 是 src-layout，
# 包根在 jiuwenbox/src/jiuwenbox/，不在仓库根）。配合下方 packages.find 的
# where=[".","jiuwenbox/src"] + include=["jiuwenclaw*","jiuwenbox*"]，让
# jiuwenbox 全部子包随 jiuwenclaw wheel 一起打出去、装进 site-packages/jiuwenbox/。
package-dir = {"jiuwenbox" = "jiuwenbox/src/jiuwenbox"}

[tool.setuptools.packages.find]
where = [".", "jiuwenbox/src"]
include = ["jiuwenclaw*", "jiuwenbox*"]
exclude = ["jiuwenclaw.cli*", "jiuwenclaw.web*"]
namespaces = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.package-data]
"*" = ["LICENSE"]
jiuwenclaw = [
    "web/dist/**/*",
    "web/dist/*",
    # config / env 模板放在 resources 目录
    "resources/**/*",
    "resources/*",
    "resources/.env.template",
    # vendor 嵌入依赖（通过 --vendor 构建）
    "vendor/**/*",
    "vendor/*",
]
# jiuwenbox 的 policy/configs yaml 必须随 wheel 带出（运行时 JiuwenBoxRunner
# 通过 JIUWENBOX_POLICY_PATH 引用，launcher/policy_engine 也读 configs）。
jiuwenbox = [
    "configs/**/*",
    "configs/*",
]

[tool.setuptools.exclude-package-data]
jiuwenclaw = [
    "web/node_modules/**",
    "web/node_modules/*",
    "web_enterprise/node_modules/**",
    "web_enterprise/node_modules/*",
]

[tool.uv.sources]
jiuwenclaw-tui = { path = "./packages/jiuwenclaw-tui" }

[dependency-groups]
# Testing (keep in sync with optional-dependencies.test)
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]

