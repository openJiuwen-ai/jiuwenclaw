[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenclaw"
version = "0.1.10.post8"
description = "JiuwenClaw"
requires-python = ">=3.9,<3.14"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "chromadb==1.5.9",
    "ruamel.yaml==0.19.1",
    "lark-oapi==1.6.7",
    "loguru==0.7.3",
    "openjiuwen==0.1.10.post4",
    "pip==26.0.1",
    "pgvector==0.4.2",
    "websockets==15.0.1",
    "aiohttp==3.14.1",
    "redis==7.4.0",
    "psutil==7.2.2",
    "aiosqlite==0.22.1",
    "croniter==6.2.2",
    "python-telegram-bot==22.7",
    "discord.py==2.7.1",
    "dingtalk-stream==0.24.3",
    "wecom-aibot-sdk==1.0.7",
    "python-socks==2.8.1",
    "greenlet==3.5.1",
    "skillnet-ai==0.0.16",
    "mutagen==1.47.0",
    "google-genai==2.7.0",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1",
    "json-repair==0.58.0",
    "trafilatura==2.0.0",
    # lxml 5.2+ 将 html.clean 拆出；trafilatura/justext 仍依赖 lxml.html.clean
    "lxml_html_clean==0.4.5",
    "tree-sitter==0.25.2",
    "tree-sitter-bash==0.25.1",
    # 缺乏这些包TestTenantAgentPool无法执行
    "sqlite-vec==0.1.6",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "openjiuwen_deepsearch==0.1.4.post1",
    "pypandoc==1.17",
    "markdown==3.10.2",
    "httpx==0.28.1",
    "PyJWT==2.13.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4"]
dev = ["pyinstaller>=6.0.0", "pywebview>=5.4"]
tui = ["jiuwenclaw-tui==0.1.10"]
# Same packages as [dependency-groups] test (pip install -e ".[test]")
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]

[project.scripts]
jiuwenclaw-app = "jiuwenclaw.app:main"
jiuwenclaw-agentserver = "jiuwenclaw.app_agentserver:main"
jiuwenclaw-gateway = "jiuwenclaw.app_gateway:main"
jiuwenclaw-web = "jiuwenclaw.app_web:main"
jiuwenclaw-start = "jiuwenclaw.start_services:main"
jiuwenclaw-init = "jiuwenclaw.init_workspace:main"
jiuwenclaw-desktop = "jiuwenclaw.desktop_app:main"
jiuwenclaw-cli = "jiuwenclaw.app_cli:main"

[tool.setuptools]
# 入口脚本现在是 jiuwenclaw 包内的一部分，不需要 py-modules
py-modules = []
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["jiuwenclaw*", "dispatch*"]
exclude = ["jiuwenclaw.cli*", "jiuwenclaw.web*"]
namespaces = false

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.setuptools.package-data]
"*" = ["LICENSE"]
jiuwenclaw = [
    "web/dist/**/*",
    "web/dist/*",
    # config / env 模板放在 resources 目录
    "resources/**/*",
    "resources/*",
    "resources/.env.template",
]
dispatch = [
    "**/*.yaml",
    "**/*.yml",
]

[tool.setuptools.exclude-package-data]
jiuwenclaw = [
    "web/node_modules/**",
    "web/node_modules/*",
    "web_enterprise/node_modules/**",
    "web_enterprise/node_modules/*",
]

[tool.uv]
override-dependencies = [
    "openjiuwen @ git+https://gitcode.com/openJiuwen/agent-core.git@v0.1.10.post4",
]

[tool.uv.sources]
jiuwenclaw-tui = { path = "./packages/jiuwenclaw-tui" }
openjiuwen = { git = "https://gitcode.com/openJiuwen/agent-core.git", tag = "v0.1.10.post4" }

[dependency-groups]
# Testing (keep in sync with optional-dependencies.test)
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.1.0",
    "coverage>=7.7.1",
    "pyyaml>=6.0",
]

