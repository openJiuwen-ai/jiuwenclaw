[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenclaw-ee-agent-client-deps"
version = "0.1.0"
description = "Pip dependencies for jiuwenclaw_ee extensions.agent_client (REST + runtime foundation)"
requires-python = ">=3.11.4,<3.14"
license = { text = "Apache-2.0" }
# 与 extension.yaml 一致；扩展代码随仓库路径加载（extension_dirs），不单独安装 gateway 根包。
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "aio-pika>=9.4",
    "openjiuwen_runtime_foundation @ git+https://gitcode.com/openJiuwen/agent-runtime.git@develop#subdirectory=foundation",
]

[tool.setuptools]
packages = []
py-modules = ["_ee_deps_agent_client"]
