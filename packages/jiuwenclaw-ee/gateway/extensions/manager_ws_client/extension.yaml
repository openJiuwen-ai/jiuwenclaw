id: jiuwenclaw_ee_manager_ws_client
name: JiuwenClaw EE Manager WS Client
version: 0.1.0
description: Gateway-only WebSocket client for Claw Manager config.push (agent_server must not load; copy .env.example to .env for database settings)
author: openjiuwen
min_jiuwenclaw_version: "0.1.0"
dependencies:
  websockets: ">=12.0"
  pydantic-settings: ">=2.0"
  python-dotenv: ">=1.0"

config_schema:
  type: object
  properties:
    enabled:
      type: boolean
      default: true
    ws_url:
      type: string
      default: "ws://127.0.0.1:8766"
      description: Claw Manager manager_ws_server WebSocket URL
