preferred_language: zh

models:
  default:
    model_client_config:
      api_base: ${API_BASE}
      api_key: ${API_KEY}
      model_name: ${MODEL_NAME}
      client_provider: ${MODEL_PROVIDER}

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}
  password: ${REDIS_PASSWORD:-}
  db: ${REDIS_DB:-0}
  key_prefix: ${REDIS_KEY_PREFIX:-jiuwenclaw:}
  pool_size: ${REDIS_POOL_SIZE:-10}
  connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
  operation_timeout: ${REDIS_OPERATION_TIMEOUT:-10}
  health_check_interval: ${REDIS_HEALTH_CHECK_INTERVAL:-30}

gateway:
  agent_client:
    type: yuanrong
    frontend_endpoint: ${YR_FRONTEND_ENDPOINT}
    function_version_urn: ${YR_FUNCTION_VERSION_URN}
    concurrency: ${YR_FRONTEND_CONCURRENCY:-1}
    invoke_timeout_s: ${YR_INVOKE_TIMEOUT_S:-60}
  session_map_scope: per_chat_bot_user
  deployment_mode: ${DEPLOYMENT_MODE:-standalone}
  instance_id: ${GATEWAY_INSTANCE_ID:-}

channels:
  feishu_enterprise:
    bot_a:
      enabled: false
      app_id:
      app_secret:
      encrypt_key:
      verification_token:
      allow_from: []

extensions:
  extension_dirs: ${EXTENSION_DIRS:-/app/jiuwenclaw/packages/jiuwenclaw-ee/gateway/extensions}
  agent_client_rest:
    enabled: ${AGENT_CLIENT_REST_ENABLED:-true}
    host: ${AGENT_CLIENT_REST_HOST:-0.0.0.0}
    port: ${AGENT_CLIENT_REST_PORT:-18080}
    # Agent Client REST 持久化库
    database:
      db_type: ${AGENT_CLIENT_DB_TYPE:-sqlite}
      sqlite_path: ${AGENT_CLIENT_SQLITE_PATH:-}
      # 关系型库连接参数（mysql 等）
      db:
        host: ${DB_HOST:-localhost}
        port: ${DB_PORT:-3306}
        user: ${DB_USER:-root}
        password: ${DB_PASSWORD:-root}
        db_name: ${DB_NAME:-openjiuwen_gateway}
