[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuwenbox"
version = "0.1.0"
description = "Jiuwen sandbox system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.31",  # SEC: CVE-2026-42561/CVE-2026-53539 multipart 解析 DoS 修复下限
    "starlette>=1.3.1",  # SEC: CVE-2026-54283 form 解析 DoS（经 fastapi 间接引入，显式钉安全下限）
    "mcp>=1.27.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
jiuwenbox = "jiuwenbox.cli.jiuwenbox:main"
jiuwenbox-server = "jiuwenbox.server.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["jiuwenbox*"]

[tool.setuptools.package-data]
jiuwenbox = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "system: System tests",
    "slow: Slow running tests",
    "async: Async tests",
]

[tool.ruff]
src = ["src"]
line-length = 100
