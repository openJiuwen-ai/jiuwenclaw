name: Code Quality Tests

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 代码质量检查
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Type checking with mypy
        run: |
          mypy jiuwenclaw/ --ignore-missing-imports || echo "Type checking completed with warnings"

      - name: Code formatting check with black
        run: |
          black --check jiuwenclaw/ || echo "Code formatting check completed"

      - name: Linting with ruff
        run: |
          ruff check jiuwenclaw/ || echo "Linting completed with warnings"

      - name: Security scan with bandit
        run: |
          bandit -r jiuwenclaw/ -f json -o bandit-report.json || echo "Security scan completed"

      - name: Upload security report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-report
          path: bandit-report.json
          retention-days: 7

  # 测试清单验证
  test-inventory:
    name: Test Inventory Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Verify test structure
        run: |
          echo "🔍 Verifying JiuwenClaw Test Structure"
          echo "========================================="
          echo ""

          # 检查单元测试
          echo "📋 Unit Tests (UT):"
          if [ -d "tests/unit_tests" ]; then
            ut_count=$(find tests/unit_tests/ -name "test_*.py" | wc -l)
            echo "  ✅ tests/unit_tests/ - $ut_count test files"
          else
            echo "  ❌ tests/unit_tests/ - Not found"
          fi

          if [ -d "tests/unit" ]; then
            ut_count_2=$(find tests/unit/ -name "test_*.py" | wc -l)
            echo "  ✅ tests/unit/ - $ut_count_2 test files"
          else
            echo "  ❌ tests/unit/ - Not found"
          fi

          echo ""

          # 检查系统测试
          echo "📋 System Tests (ST):"
          if [ -d "tests/system_tests" ]; then
            st_count=$(find tests/system_tests/ -name "test_*.py" | wc -l)
            echo "  ✅ tests/system_tests/ - $st_count test files"
            echo "  📁 Available ST test files:"
            find tests/system_tests/ -name "test_*.py" -exec basename {} \;
          else
            echo "  ❌ tests/system_tests/ - Not found (NOT_FOUND error)"
          fi

          echo ""

          # 检查集成测试
          echo "📋 Integration Tests:"
          if [ -d "tests/integration" ]; then
            it_count=$(find tests/integration/ -name "test_*.py" | wc -l)
            echo "  ✅ tests/integration/ - $it_count test files"
          else
            echo "  ⚠️  tests/integration/ - Not found (optional)"
          fi

          echo ""
          echo "========================================="
          echo "✅ Test Inventory Verification Complete"
