apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-web
  namespace: jiuwenclaw
  labels:
    app: jiuwenclaw-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiuwenclaw-web
  template:
    metadata:
      labels:
        app: jiuwenclaw-web
    spec:
      containers:
        - name: web
          image: <<WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
            - name: websocket
              containerPort: 19000
              protocol: TCP
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
          env:
            - name: JIUWENCLAW_WEB_HOST
              value: "0.0.0.0"
            - name: JIUWENCLAW_WEB_PORT
              value: "5173"
            - name: ENTERPRISE_WEB_WS_HOST
              value: "0.0.0.0"
            - name: ENTERPRISE_WEB_WS_PORT
              value: "19000"
            - name: WS_ORIGIN_CHECK_ENABLED
              value: "false"
            - name: WS_ALLOWED_ORIGINS
              value: ""
            - name: TZ
              value: "Asia/Shanghai"
            - name: JIUWENCLAW_MINIO_ENDPOINT
              value: <<OBS_URL>>
            - name: JIUWENCLAW_MINIO_ACCESS_KEY
              value: <<OBS_ACCESS_KEY>>
            - name: JIUWENCLAW_MINIO_BUCKET
              value: <<OBS_BUCKET>>
            - name: JIUWENCLAW_MINIO_SECURE
              value: <<OBS_SECURE>>
            - name: JIUWENCLAW_MINIO_PUBLIC_BASE_URL
              value: ""
            - name: JIUWENCLAW_MINIO_REGION
              value: <<OBS_REGION>>
---
# 集群内部访问： 提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-web
  namespace: jiuwenclaw
spec:
  selector:
    app: jiuwenclaw-web
  ports:
    - name: websocket
      port: 19000 # Service 端口
      targetPort: 19000 # 容器端口
  type: ClusterIP # 集群内部访问，不需要外网
---
# NodePort Service：供外连接
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-web-nodeport
  namespace: jiuwenclaw
spec:
  type: NodePort
  ports:
    - port: 5173 # 集群内部端口
      targetPort: 5173 # 容器端口
      nodePort: <<WEB_NODE_PORT>> # 外部访问端口（30000-32767）
  selector:
    app: jiuwenclaw-web
