apiVersion: v1
data:
  config.yaml: |
    # 前端显示语言：zh（中文）/ en（英文），与 Web 界面语言切换同步
    preferred_language: zh
    # 日志目录：~/.jiuwenclaw/agent/.logs/
    # gateway.log / channel.log / agent_server.log 按源码路径分流；full.log 为汇总。
    # level：未单独指定时的默认级别。console_level：控制台；可省略则用 level。
    # 环境变量 LOG_LEVEL 仅覆盖控制台级别（不覆盖各日志文件）。
    logging:
      level: INFO
      console_level: INFO
      gateway: INFO
      channel: INFO
      agent_server: INFO
      full: INFO
    memory:
      # ============================================================
      # 记忆系统配置
      # ============================================================
      # 两个正交开关：
      #   1) engine — 挂载哪套 rail（内置 / 外接 / 都挂 / 都不挂）
      #   2) mode   — 内置记忆的存储位置（local | cloud），不影响外接
      #
      # 外接 rail 的启用 = (engine ∈ {external, both}) AND (external.provider 非空)
      # 内置 rail 的启用 = (engine ∈ {builtin, both})  AND (mode=local)
      #                    AND modes.agent.<当前 mode>.memory.enabled=true
      # ============================================================
      mode: ${MEMORY_MODE:-local} # 内置记忆存储位置：local | cloud
      # 记忆引擎总开关：builtin | external | both | none
      #   builtin  — 仅内置记忆（默认，兼容旧配置）
      #   external — 仅外接记忆（LTM / 插件）
      #   both     — 内置 + 外接并存
      #   none     — 全部关闭
      engine: ${MEMORY_ENGINE:-none}
      forbidden_memory_definition:
        enabled: false
        patterns: []
        description:
          zh: "以下内容禁止记忆：密码、API密钥、Secret、Token、信用卡号、身份证号、手机号等敏感信息"
          en: "The following content is forbidden to remember: passwords, API keys, secrets, tokens, credit card numbers, ID numbers, phone numbers and other sensitive information"
      # ------------------------------------------------------------
      # 外接记忆（External Memory）
      # ------------------------------------------------------------
      # 启用方式（任选一种）：
      #
      # 【方案 1：YAML 直接改】
      #   memory.engine: external   # 或 both
      #   memory.external.provider: openjiuwen   # 选一个：openjiuwen | <plugin-name>
      #   # 然后在下方对应的 openjiuwen 子段填 api_key
      #
      # 【方案 2：环境变量覆盖】
      #   export MEMORY_ENGINE=external
      #   export MEMORY_EXTERNAL_PROVIDER=openjiuwen
      #
      # 【关闭外接记忆】
      #   把 memory.engine 改回 builtin 或 none；
      #   或把 memory.external.provider 留空（两者任一生效即可禁用）
      #
      # 【挂载模式常见组合】
      #   ┌─────────────┬───────────────┬──────────────────────────────────────┐
      #   │ engine      │ provider      │ 效果                                 │
      #   ├─────────────┼───────────────┼──────────────────────────────────────┤
      #   │ builtin     │ *             │ 只挂内置（默认；外接即使填了也不挂）    │
      #   │ external    │ openjiuwen    │ 只挂外接 LTM                         │
      #   │ external    │ <plugin-name> │ 只挂用户安装的插件                    │
      #   │ both        │ 任一          │ 内置 + 外接同时挂（LLM 两套工具并列）   │
      #   │ none        │ *             │ 全关，任何记忆 rail 都不挂             │
      #   └─────────────┴───────────────┴──────────────────────────────────────┘
      #
      # 说明：
      # - 外接记忆 mode-independent：配置一次，plan / fast 模式全程生效，
      #   跨 config 热重载持久存活（保留 prefetch 缓存、电路断路器、会话状态）
      # - 单 provider 策略：同一时刻 provider 只能选一个
      # - 失败降级：provider 构建失败或网络异常不阻塞主流程
      external:
        # 选哪家 provider。空字符串 = 禁用外接（等价于 engine=builtin）
        provider: ${MEMORY_EXTERNAL_PROVIDER:-openjiuwen} # '' | openjiuwen| <plugin-name>
        # 数据隔离标识（所有 provider 共用）
        user_id: ${MEMORY_USER_ID:-__default__}
        scope_id: ${MEMORY_SCOPE_ID:-__default__}
        # -- OpenJiuwen LTM（本地长期记忆：KV + 向量 + DB）--
        # 生效条件：provider='openjiuwen'
        # 依赖顶层 embed 段提供 embedding 配置（不单独配置 api_key）
        openjiuwen:
          kv_type: shelve # shelve | in_memory | sqlite
          kv_path: ${MEMORY_KV_PATH:-} # 默认 ~/.jiuwenclaw/memory/ltm/kv
          vector_type: chroma # chroma
          vector_persist_dir: ${MEMORY_VECTOR_DIR:-} # 默认 ~/.jiuwenclaw/memory/ltm/chroma
          db_type: sqlite
          db_path: ${MEMORY_DB_PATH:-} # 默认 ~/.jiuwenclaw/memory/ltm/ltm.db
    models:
      default:
        model_client_config:
          api_base: ${API_BASE}
          api_key: ${API_KEY}
          model_name: ${MODEL_NAME}
          client_provider: ${MODEL_PROVIDER}
          timeout: 1800
          verify_ssl: false
        model_config_obj:
          temperature: 0.6
      video:
        model_client_config:
          api_base: ${VIDEO_API_BASE}
          api_key: ${VIDEO_API_KEY}
          model_name: ${VIDEO_MODEL_NAME}
          client_provider: ${VIDEO_PROVIDER}
          timeout: 1800
          verify_ssl: false
        model_config_obj:
          temperature: 0.6
      audio:
        model_client_config:
          api_base: ${AUDIO_API_BASE}
          api_key: ${AUDIO_API_KEY}
          model_name: ${AUDIO_MODEL_NAME}
          client_provider: ${AUDIO_PROVIDER}
          verify_ssl: false
          timeout: 1800
        model_config_obj:
          temperature: 0.6
      vision:
        model_client_config:
          api_base: ${VISION_API_BASE}
          api_key: ${VISION_API_KEY}
          model_name: ${VISION_MODEL_NAME}
          client_provider: ${VISION_PROVIDER}
          verify_ssl: false
          timeout: 1800
        model_config_obj:
          temperature: 0.6
    telemetry:
      enabled: false # 总开关（环境变量 OTEL_ENABLED 优先）
      exporter: otlp # otlp / console / none
      endpoint: http://localhost:4317 # OTLP endpoint
      protocol: grpc # grpc / http
      headers: {} # 公共 OTLP headers，可被 traces/metrics 覆盖
      log_messages: true # 是否在 span event 中记录完整消息内容
      service_name: jiuwenclaw
      provider_factory: # 自定义 provider factory，格式：module:function
      traces:
        exporter: # trace exporter，默认回退到 telemetry.exporter
        endpoint: # trace endpoint，默认回退到 telemetry.endpoint
        protocol: # trace protocol，默认回退到 telemetry.protocol
        headers: {} # trace headers，默认回退到 telemetry.headers
      metrics:
        exporter: # metrics exporter，默认回退到 telemetry.exporter
        endpoint: # metrics endpoint，默认回退到 telemetry.endpoint
        protocol: # metrics protocol，默认回退到 telemetry.protocol
        headers: {} # metrics headers，默认回退到 telemetry.headers
    react:
      agent_name: main_agent
      max_iterations: 10
      model_name: ${MODEL_NAME:-deepseek-chat}
      skill_mode: all
      # 禁用的工具列表，添加 fork_agent 可避免并行调用触发 API 限流
      # 禁用后用户需使用 spawn_subagent 替代
      # disabled_tools: ["fork_agent"]
      # code_agent / research_agent 默认不启用；只有显式配置 enabled: true 才会显示并可被 task_tool 调用
      # browser_agent 保持原行为，仍由浏览器 runtime 开关决定是否默认注册；这里只支持覆盖其参数
      subagents:
        code_agent:
          enabled: false
          # max_iterations: 15
        research_agent:
          enabled: false
          # max_iterations: 15
      answer_chunk_size: 500
      stream_chunk_threshold: 50
      stream_character_threshold: 2000
      # 上下文窗口展示用上限（token）：前端占用条的分母，需与所用模型官方窗口对齐填写；百分比分子为单次调用的输入+输出（并与 total 取较大值）
      context_window_limit_tokens: 128000
      context_engine_config:
        # ---------- 关停 / 切链开关 ----------
        # 整体关闭上下文工程（链 A/B 全部不挂载，仅 default_window_round_num 滑动窗口）：
        #   enabled: false
        # 关闭 KV cache 释放（推理后端亲和优化）：
        #   enable_kv_cache_release: false
        # 关闭 reload 工具（模型不能再调 reload_original_context_messages 拉回 offload 内容）：
        #   enable_reload: false
        # 切回链 A（DialogueCompressor / MessageSummaryOffloader / CurrentRoundCompressor /
        # RoundLevelCompressor 4 类）—— 显式关 SessionMemory：
        #   session_memory: false
        # 关链 B 中的某一层（不切链）：
        #   ⚠ 链 B 是 preset 注入，yaml 里删 key 或写空 dict 仍按预置默认启用，无法物理移除。
        #   调测时把阈值调到极大即等价于不触发：
        #     tool_result_budget.tokens_threshold: 99999999
        #     micro_compact.trigger_threshold: 99999  + keep_recent_per_tool: 99999
        #     full_compact.trigger_total_tokens: 99999999
        #   彻底物理移除某层须改 agent-core 的 _merge_processors 预置或切链 A。
        enable_kv_cache_release: false
        enable_reload: true
        # 关闭 SDK 默认英文 reload prompt；中文版由 JiuClawContextEngineeringRail 注入。
        enable_reload_prompt: false
        enabled: true # 总开关：false = 链 A/B 全关，仅默认窗口生效
        # 同时刻可 pin 进 LLM 上下文的 active skill 正文条数（默认 1）。>1 时才可在 load 多技能时
        # 都保留 [ACTIVE SKILL BODY]；为 1 时再 load 会驱逐前一个（trace 里 [ACTIVE SKILL EVICTED]）。
        # max_active_skill_bodies: 1

        # ============ 一键切链（链 B 默认 / 链 A 备选）============
        # 当前：链 B = SessionMemory + ToolResultBudget + MicroCompact + FullCompact
        # 切链 A = MessageSummaryOffloader + DialogueCompressor + CurrentRoundCompressor + RoundLevelCompressor
        #
        #   切链 A：把下方 `session_memory: { ... }` dict 整段注释掉，然后取消下一行：
        # session_memory: false
        #         ↑ 取消注释这行 + 注释掉下方 dict，即切到链 A
        #         同时取消文件底部"链 A 备选块"4 个 *_config 的注释（按需调参）。
        #
        #   切回链 B：把上面两步反过来即可（恢复 dict + 注释回这行）。
        #
        # 顺序约束（小 → 大）：
        #   session_memory.trigger_tokens
        #     < tool_result_budget.tokens_threshold (单 round tool 总和)
        #     < full_compact.trigger_total_tokens   (整窗口总 token)
        # 数值面向 200k 窗口；128k 模型需整体下调。
        # ===========================================================
        session_memory:
          # 滚动写"会话笔记"到工作区文件（不在 trace 里）；FullCompact 走 session_memory 路径会用。
          trigger_tokens: 10000 # 首次写笔记：窗口 token ≥ 此值开始写
          trigger_add_tokens: 5000 # 增量节奏：每多 N token 追写一次（应 ≤ trigger_tokens）
          tool_min_: 3 # 两次笔记间至少 N 次工具调用，避免抖动；≥1
          # update_mode: agent_edit             # agent_edit=ReActAgent 编辑 / direct_replace=整体重写
          # direct_replace_max_retries: 2       # direct_replace 失败重试次数
          # model / model_client:               # 写笔记的 LLM；不设则继承默认模型
        tool_result_budget_processor_config:
          # 单 round 内 ToolMessage 总 token 超阈值，且单条 > large_message_threshold 时，
          # 把该条替换为 OffloadToolMessage：<persisted-output>...preview...</persisted-output>。
          tokens_threshold: 15000 # 单 round tool 结果总 token 阈值；relay-claw 实测峰值 ~58k、典型一轮 4 个 fetch_webpage ≈ 16k 即触发；200k 窗口默认 50000，128k 模型建议 25000~30000
          large_message_threshold: 5000 # 单条 ToolMessage 算"大"的门槛（候选）；< tokens_threshold；源码默认 10000，5000 让 5k+ 的 webpage 优先被 offload
          # trim_size: 3000                      # offload 后 preview 字符数；应 << 原文长度
          # tool_name_allowlist: null            # 仅这些工具的结果才考虑 offload；null/空 = 全部允许
          # offload_message_type: ["tool"]       # 当前仅支持 tool
          # messages_threshold: null             # 备用消息计数阈值；当前主走 tokens 路径
          # messages_to_keep: null               # 备用：保留尾部 N 条不动
        micro_compact_processor_config:
          # 同一工具调用次数 > trigger_threshold + keep_recent_per_tool 时，
          # 把"较旧的那 keep_recent_per_tool 条之外"的全部替换为 cleared_marker。
          trigger_threshold: 5 # 触发额度（在 keep 之上还能堆多少条）
          keep_recent_per_tool: 10 # 每工具保留最近 N 条原文，源码默认 15。
          # cleared_marker: "[Old tool result content cleared]"   # 替换后的占位文案
          # compactable_tool_names: 白名单（精确匹配 ToolMessage.name），不在名单的工具完全忽略。
          # 选取标准：本 harness 真实出现 + 单条返回较大 + 历史可丢（再要时可重新调用）。
          # 提醒：bash 输出常含执行证据（错误堆栈、产物路径），spawn_subagent 是已消耗 token 的成果，
          # 折叠后无法回溯。本配置纳入是基于 relay-claw 实测 bash/spawn_subagent 多用于查询性命令、
          # 单条体积大且压缩收益高；如果你的场景里 bash 主要做有副作用的执行，请把它移出白名单。
          # 源码默认 ["grep","glob","read_file","web_search","web_fetch"] 是 Claude Code 命名空间，
          # relay-claw / jiuwenclaw 不使用这些名字，故白名单只列本 harness 实际命名空间下的工具。
          compactable_tool_names:
            - fetch_webpage
            - mcp_fetch_webpage
            - free_search
            - mcp_free_search
            - bash
            - spawn_subagent
            - mcp_petal_search
        full_compact_processor_config:
          # 整窗口 token 超阈值时，调一次 LLM 把历史压成
          # [FULL_COMPACT_BOUNDARY] + summary，并在尾部 reinject 最近 skill/file/task_status 等关键状态。
          trigger_total_tokens: 100000 # 整窗口 token 阈值；202k 窗口下预留 ~22k 给压缩调用本身；128k 模型建议 100000
          # compression_call_max_tokens: 200000   # 压缩调 LLM 时的最大上下文预算
          # messages_to_keep: 10                  # 保留最近 N 条；buffer < 此值时不会"删历史"，只新增 summary
          # keep_tool_message_pairs: true         # 保留区里成对的 (tool_call ↔ tool_result) 不被截断
          # state_snapshot_max_chars: 4000        # state 快照（plan/task/skills）正文最大字符
          # reinject_recent_skills: 3             # summary 后重注最近 N 个 skill
          # reinject_file_tool_names:             # 在 summary 末尾重注这些工具的最近调用（默认列表）
          #   ["read_file","write_file","edit_file","glob","grep"]
          # reinject_tool_result_hint_names:      # 同上，针对 tool 结果的提示
          #   ["read_file","write_file","edit_file","glob","grep"]
          # marker: "[FULL_COMPACT_BOUNDARY]"     # 系统消息分界 marker
          # state_marker: "[FULL_COMPACT_STATE]"  # state 块 marker
          # synthetic_user_marker: "[earlier conversation truncated for compaction retry]"
          # session_memory_enabled: true          # 优先用 session_memory 笔记替换历史；放不下再走 LLM 全量压
          # session_memory_marker: "[SESSION_MEMORY_BOUNDARY]"
          # summary_intro / recent_messages_notice / session_memory_intro:   # 文案，一般不改
          # model / model_client:                 # 全量压缩的 LLM；不设则继承默认模型
        # ----------------------------------------------------------------------------------
        # ---------- 预置链 A（仅当 session_memory: false 时生效；与链 B 二选一）----------
        # 取消下方注释 + 顶部加 `session_memory: false` 即切回链 A。
        # 数值参考 develop 分支默认档（200k 窗口）；其余字段均按源码默认。
        # message_summary_offloader_config:        # offload 大工具结果到摘要
        #   tokens_threshold: 60000                # 总 token 超过即触发
        #   large_message_threshold: 20000         # 单条算"大消息"的门槛
        #   protected_tool_names: ["read_file:*SKILL.md", "reload_original_context_messages"]
        # dialogue_compressor_config:              # 对话级摘要压缩
        #   tokens_threshold: 100000
        #   messages_to_keep: 10                   # 保留最近 N 条
        #   compression_target_tokens: 1800        # 摘要目标 token
        # current_round_compressor_config:         # 当前 round 内压缩
        #   tokens_threshold: 100000
        #   messages_to_keep: 6
        #   compression_target_tokens: 4000
        # round_level_compressor_config:           # round 级递归压缩（兜底）
        #   trigger_total_tokens: 230000           # 触发总 token；> target_total_tokens
        #   target_total_tokens: 160000            # 压缩后目标总 token
        #   keep_recent_messages: 6                # 末尾保护区
      # SkillToolkit：search_skill（SkillNet/ClawHub）/ install_skill / uninstall_skill
      skill_toolkit:
        # false = 不向 agent 注册 search_skill（install_skill、uninstall_skill 仍注册）
        search_skill_enabled: false
      # Skills 在线自演进配置
      evolution:
        enabled: false # true = 启用在线 Skills 自演进
        auto_scan: false # true = 每轮对话后自动扫描（建议先用手动 /evolve）
        skill_base_dir: "agent/skills" # Skill 根目录
      # LLM 调用重试配置
      llm_retry:
        enabled: true # 重试开关
        max_attempts: 3 # 最大尝试次数（含首次）
        initial_backoff: 10.0 # 初始等待时间（秒）
        max_backoff: 60.0 # 最大等待时间（秒）
        backoff_factor: 2.0 # 等待倍率
        retry_on_rate_limit: true # 是否重试 429 限流
    tools:
      - todo
      - skill
    email_settings:
      email_address: ${EMAIL_ADDRESS}
      token: ${EMAIL_TOKEN}
      smtp_server: ${SMTP_SERVER:-smtp.gmail.com}
      port: ${EMAIL_PORT:-587}
    embed:
      embed_api_key: ${EMBED_API_KEY}
      embed_base_url: ${EMBED_API_BASE}
      embed_model: ${EMBED_MODEL}
    task_memory:
      # Set enabled: true to activate TaskMemoryService skill tools
      # (experience_retrieve, experience_learn, experience_clear)
      enabled: false
      # Override defaults below if task memory uses a different model/key than the main agent
      llm_model: ${TASK_MEMORY_LLM_MODEL}
      embedding_model: ${TASK_MEMORY_EMBED_MODEL}
      api_key: ${TASK_MEMORY_API_KEY}
      api_base: ${TASK_MEMORY_API_BASE}
      # Retrieval and summary algorithms: ACE | ReasoningBank | ReMe
      retrieval_algo: ACE
      summary_algo: ACE
    # ========== Redis（分布式 Gateway：状态存储 / Pub/Sub / Leader；standalone 下不连接）==========
    # 通过 gateway.deployment_mode 控制：standalone（不连接）/ active-standby、distributed（连接 Redis）
    redis:
      # standalone | cluster
      mode: ${REDIS_MODE:-standalone} # standalone | cluster
      # host 可为 单机 host/host:port 或 集群逗号列表(如 10.0.0.11:6379,10.0.0.12:6379);不带端口时用 port
      host: ${REDIS_HOST:-localhost}
      port: ${REDIS_PORT:-6379}
      password: ${REDIS_PASSWORD:-}
      db: ${REDIS_DB:-0}
      # Session 数据过期时间（秒）
      session_ttl: ${REDIS_SESSION_TTL:-604800}
      key_prefix: ${REDIS_KEY_PREFIX:-jiuwenclaw:}
      pool_size: ${REDIS_POOL_SIZE:-10}
      connect_timeout: ${REDIS_CONNECT_TIMEOUT:-5}
      operation_timeout: ${REDIS_OPERATION_TIMEOUT:-10}
      health_check_interval: ${REDIS_HEALTH_CHECK_INTERVAL:-30}
    gateway:
      # AgentServer client mode.
      # websocket: default ws client
      # yuanrong: provided by AgentServerClientExtension
      agent_client:
        type: jiuwen # websocket | yuanrong
        frontend_endpoint:
        function_version_urn:
        concurrency: 1
        invoke_timeout_s: 60
      # SessionMap 用于多 bot 场景（如 channels.feishu.<bot_key>）：将平台身份映射为 Agent 的 session_id。
      # 取值：per_chat_bot（默认，同 chat+bot 共享会话）, per_chat_bot_user（按 user 分会话）
      session_map_scope: per_chat_bot_user
      # 会话列表存储模式：local（默认）或 remote。
      # local：session.list 直接扫描本机 sessions 目录（适用于同机部署）。
      # remote：Gateway 在本地维护最多 10 条会话索引，适用于 Gateway 与 Agent 分机部署时。
      # 分机部署时请设置为 remote，否则 session.list 将读取网关本机目录（通常为空）。
      web_session_storage: local
      # ========== 部署模式 ==========
      # standalone（默认）：单机，不连 Redis
      # active-standby：主备，连接 Redis + LeaderElection 选主
      # distributed：多副本同时在线，连接 Redis 共享 session（无选主；cron 默认关闭；仅 web/tui 通道）
      deployment_mode: ${DEPLOYMENT_MODE:-standalone}
      # 分布式下用于实例标识；空则启动时自动生成（见 gateway-reliability-enhancement-design §3.2）
      instance_id: ${GATEWAY_INSTANCE_ID:-}
    heartbeat:
      # 心跳间隔（秒），默认 60
      every: 3600
      # 心跳结果回传的 channel（如 "web"），
      target: web
      # 心跳生效时间段（本地时间），start <= now < end 时心跳生效
      active_hours:
        start: 08:00
        end: 22:00
    # web_enterprise 聊天附件上传（自部署 MinIO / S3 兼容对象存储）
    # 环境变量可覆盖：JIUWENCLAW_MINIO_ENDPOINT / ACCESS_KEY / SECRET_KEY / BUCKET / SECURE / PUBLIC_BASE_URL
    minio:
      endpoint:
      access_key:
      secret_key:
      bucket: jiuwenclaw
      secure: false
      # 可选。设置后返回固定公网 URL（需 bucket 可读策略）；未设置则返回 presigned URL（默认 7 天）
      public_base_url:
    channels:
      web:
        send_file_allowed: true
      feishu: {}
      xiaoyi:
        # 华为小艺 A2A 配置
        mode: xiaoyi_channel
        ak:
        sk:
        api_id:
        push_id:
        agent_id:
        ws_url1: wss://hag.cloud.huawei.com/openclaw/v1/ws/link
        ws_url2: wss://116.63.174.231/openclaw/v1/ws/link
        enable_streaming: true
        enabled: false
        # xiaoyi_claw配置
        uid:
        api_key:
        push_url:
        file_upload_url:
        # 小艺手机端插件tools调用，会添加相关tools到系统提示词
        phone_tools_enabled: false
        send_file_allowed: true
      dingtalk:
        # 钉钉应用配置
        client_id:
        client_secret:
        allow_from: []
        enabled: false
        send_file_allowed: true
      telegram:
        # Telegram Bot 配置
        # 从 @BotFather 获取 bot_token
        bot_token:
        # 用户白名单（Telegram user_id），为空则允许所有用户
        allow_from: []
        # 消息解析模式: Markdown, HTML, None
        parse_mode: Markdown
        # 群聊模式: mention(仅响应@提及), reply(仅响应回复), all(响应所有), off(禁用群聊)
        group_chat_mode: mention
        enabled: false
      discord:
        # Discord Bot 配置（当前版本仅支持参数管理）
        # 可与用户私聊（DM）：仍受 allow_from 约束
        # Bot Token（Discord Developer Portal -> Bot）
        bot_token:
        # Application ID（Discord Developer Portal -> General Information）
        application_id:
        # 目标服务器 ID（Guild ID）
        guild_id:
        # 目标频道 ID（Channel ID）
        channel_id:
        # 用户白名单（Discord user_id），为空则允许所有用户
        allow_from: []
        # 是否关闭私信功能
        block_dm: false
        enabled: false
      whatsapp:
        # WhatsApp 配置（通过本地 Baileys bridge）
        bridge_ws_url: ws://127.0.0.1:19600/ws
        default_jid:
        allow_from: []
        enable_streaming: true
        auto_start_bridge: false
        bridge_command: node scripts/whatsapp-bridge.js
        bridge_workdir:
        enabled: false
      wechat:
        # 个人微信 iLink Bot API 配置
        enable_streaming: false
        base_url: https://ilinkai.weixin.qq.com
        bot_token:
        ilink_bot_id:
        ilink_user_id:
        allow_from: []
        auto_login: true
        qrcode_poll_interval_sec: 2.0
        long_poll_timeout_sec: 45
        backoff_base_sec: 1.0
        backoff_max_sec: 30.0
        credential_file: ~/.wx-ai-bridge/credentials.json
        enabled: false
      wecom:
        # 企业微信 AI 机器人配置
        bot_id:
        secret:
        ws_url: wss://openws.work.weixin.qq.com
        allow_from: []
        enable_streaming: true
        send_thinking_message: false
        enabled: false
        send_file_allowed: true
        # 群聊数字分身（默认关闭）
        group_digital_avatar: false
        my_user_id: ""
        bot_name: ""
        enable_memory: false
    # ========== 工具权限管控 ==========
    #
    # 三种整工具动作: allow / ask / deny。
    # tools.<name> 优先于参数级规则；allow/deny 会直接短路。
    # rules / approval_overrides 仅匹配 shell 命令文本，schema 为：
    #   - id: string
    #     description: string
    #     pattern: string or re:...
    #     action: allow | deny
    permissions:
      enabled: true
      # Default permission for tools not listed below.
      defaults: ask
      tools:
        bash: ask
        mcp_exec_command: ask
        create_terminal: ask
        write: ask
        write_file: ask
        edit_file: ask
        search_replace: ask
        write_memory: allow
        edit_memory: allow
        read_memory: allow
        memory_search: allow
        memory_get: allow
        todo_create: allow
        todo_insert: allow
        todo_complete: allow
        todo_remove: allow
        todo_list: allow
        # Coding Memory 工具权限
        coding_memory_write: allow
        coding_memory_edit: allow
        coding_memory_read: allow
        # 外接记忆工具（External Memory — OpenJiuwen）
        ltm_search: allow
        ltm_search_summary: allow
        viking_search: allow
        viking_read: allow
        viking_browse: allow
        viking_remember: allow
        viking_add_resource: allow
        mcp_free_search: allow
        mcp_paid_search: allow
        mcp_petal_search: allow
        mcp_fetch_webpage: allow
        cron_list_jobs: allow
        cron_get_job: allow
        cron_create_job: allow
        cron_update_job: allow
        cron_delete_job: allow
        cron_toggle_job: allow
        cron_preview_job: allow
      rules:
        - id: shell_allow_dir
          pattern: "dir *"
          action: allow
        - id: shell_allow_ls
          pattern: "ls *"
          action: allow
        - id: shell_allow_pwd
          pattern: "pwd *"
          action: allow
        - id: shell_allow_cd
          pattern: "cd *"
          action: allow
        - id: shell_allow_echo
          pattern: "echo *"
          action: allow
        - id: shell_allow_cat
          pattern: "cat *"
          action: allow
        - id: shell_allow_type
          pattern: "type *"
          action: allow
        - id: shell_allow_tree
          pattern: "tree *"
          action: allow
        - id: shell_allow_get_childitem
          pattern: "Get-ChildItem *"
          action: allow
        - id: shell_allow_get_content
          pattern: "Get-Content *"
          action: allow
        - id: shell_allow_select_string
          pattern: "Select-String *"
          action: allow
        - id: shell_allow_head
          pattern: "head *"
          action: allow
        - id: shell_allow_tail
          pattern: "tail *"
          action: allow
        - id: shell_allow_git_status
          pattern: "git status *"
          action: allow
        - id: shell_allow_git_log
          pattern: "git log *"
          action: allow
        - id: shell_allow_git_diff
          pattern: "git diff *"
          action: allow
        - id: shell_allow_git_branch
          pattern: "git branch *"
          action: allow
      approval_overrides: []
      # 数字分身 owner-scoped 权限（默认空，不生效）
      owner_scopes: {}
      deny_guidance_message: ""
      # Phase-1: 命令意图抽取（L1 shlex + L3-Cmd LLM）；关闭后只保留工具参数三轴判定。
      command_intent:
        enabled: true
        timeout_seconds: 15
        extra_body:
          thinking:
            type: disabled
      # Phase-1: 文件路径三轴权限（read / write / exec）。
      # - workspace: agent workspace 内的读写默认放行（rw_enabled=false 时所有内部读写也要审批）
      # - global:    workspace 外的读写白名单（最长前缀匹配）；
      #              entry 形如 {read_enable: true, write_enable: false}
      # - trusted_exec_directory: 允许「通过解释器执行」的脚本目录前缀列表
      # - tool_bindings: 在不改代码的情况下把额外工具的某个参数注册为 read / write / exec
      file_guard:
        workspace:
          rw_enabled: true
          description: "Agent workspace 内默认放行 read / write"
        global: {}
        trusted_exec_directory: []
        tool_bindings: {}
      # 兼容键：旧 external_directory 在加载时会被自动迁移到 file_guard.global，
      # 新写入入口（persist_*）一律落到 file_guard，不再回写这里。
      external_directory:
        "*": "ask"
    browser:
      # chrome_path can be a string or per-OS map.
      # Example:
      # chrome_path:
      #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
      #   macos: "/Applications/Google Chrome.app"
      #   linux: "/usr/bin/google-chrome"
      remote_debugging_address: "127.0.0.1"
      remote_debugging_port: 9222
      # empty means use launcher default profile path by OS
      user_data_dir: ""
      profile_directory: "Default"
    updater:
      enabled: true
      repo_owner: CharlieZhao95
      repo_name: jiuwenclaw
      release_api_url: ""
      asset_name_pattern: "jiuwenclaw-setup-{version}.exe"
      sha256_name_pattern: "jiuwenclaw-setup-{version}.exe.sha256"
      timeout_seconds: 20
    # 文件传输配置（分布式部署模式）
    # 当 Gateway 和 AgentServer 分开部署时，需要启用此配置
    file_transfer:
      # 是否启用分布式模式（true=启用 WebSocket 文件传输）
      enabled: false
      # 分片大小（字节），默认 64KB
      chunk_size: 65536
      # 最大文件大小（字节），默认 100MB，0=不限制
      max_file_size: 104857600
      # 传输超时时间（秒），默认 300 秒
      transfer_timeout: 300
      # 单分片最大重试次数
      max_retries: 3
      # 接收文件存储目录（相对于 workspace）
      received_files_dir: "received_files"
      # 临时文件清理间隔（秒）
      cleanup_interval: 3600
      # 清理超过 N 秒的临时文件
      cleanup_age: 86400
      # 最大并发传输数
      max_concurrent_transfers: 5
    extensions:
      # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
      # EXTENSION_DIRS="E:/a;D:/b"; 默认会加载仓库根目录 extensions
      extension_dirs: ${EXTENSION_DIRS:-extensions}
      # 外置扩展 agent_client REST 监听（实现位于 packages/jiuwenclaw-ee/gateway/extensions/agent_client/agent_client_rest）；本地开发可通过环境变量覆盖
      agent_client_rest:
        enabled: ${AGENT_CLIENT_REST_ENABLED:-true}
        host: ${AGENT_CLIENT_REST_HOST:-127.0.0.1}
        port: ${AGENT_CLIENT_REST_PORT:-18080}
        # Agent Client REST 持久化库
        database:
          db_type: ${AGENT_CLIENT_DB_TYPE:-sqlite}
          sqlite_path: ${AGENT_CLIENT_SQLITE_PATH:-}
          # 关系型库连接参数（mysql / postgresql 等）
          db:
            host: ${DB_HOST:-localhost}
            port: ${DB_PORT:-3306}
            user: ${DB_USER:-root}
            password: ${DB_PASSWORD:-root}
            db_name: ${DB_NAME:-openjiuwen_gateway}
    team:
      team_name: jiuwen_team
      lifecycle: persistent
      teammate_mode: build_mode
      spawn_mode: inprocess
      leader:
        member_name: team_leader
        display_name: 团队领导
        persona: "天才项目管理专家，擅长任务分解和团队协调"
      agents:
        leader:
          workspace:
            stable_base: true
          max_iterations: 200
          completion_timeout: 600.0
      workspace:
        enabled: true
      transport:
        type: inprocess
      storage:
        type: sqlite
    modes:
      # 一级模式 agent / code / team
      agent:
        # agent 模式支持 性能/规划/集群
        fast:
          memory:
            enabled: true
            is_proactive: false
          rails:
          tools:
        plan:
          memory:
            enabled: true
            is_proactive: true
          rails:
          tools:
        team:
      code:
        # code 模式
        memory:
        rails:
        tools:
    # Petal 搜索：默认关闭；为 true 时需同时配置环境变量 API_BASE（或 OPENAI_BASE_URL）与 default_headers（JSON）
    enable_petal_web_search: true
    # DeepResearch 工具：默认开启
    enable_deepresearch: true
    # ========== Sandbox（jiuwenbox 沙箱集成）==========
    #
    # 该段控制 agent-server 在构建 SysOperationCard 时是否走沙箱模式连接 jiuwenbox。
    #
    # **本版本: sandbox 配置已整段切换到环境变量驱动**。 ``config.yaml::sandbox``
    # 段保留只是为了让旧配置文件不报错; agent-server 在读取 sandbox 时**完全不
    # 看本段**, 一切以 ``JIUWENCLAW_SANDBOX_*`` 环境变量为准 (见 ``jiuwenclaw/
    # config.py`` 顶部的 env 列表)。 K8s / 企业部署直接通过 ConfigMap / Deployment
    # env 注入即可。
    #
    # 重要约束（本版本）:
    # - 当前 agent-server 不负责拉起 jiuwenbox 子进程; jiuwenbox 由外部启动并自管
    #   policy（典型方式: 容器化部署见 claw2b/jiuwenbox/docker/Dockerfile, 或手动
    #   ``python -m jiuwenbox.server.launcher`` 监听 ``url`` 所示端口）。
    # - ``JIUWENCLAW_SANDBOX_STARTUP_MODE`` 仅接受 ``external`` (默认值)。其语义是
    #   "使用 ``JIUWENCLAW_SANDBOX_URL`` 端点连接由外部启动的 jiuwenbox";
    #   ``internal`` (agent-server 自动 spawn jiuwenbox) 不在本工程实现, 任何其它
    #   取值会让 ``get_sandbox_endpoint`` 抛 ValueError 并阻止 sandbox 模式生效。
    # - ``JIUWENCLAW_SANDBOX_PRESERVE_FILE_SHARING_MODE`` 仅接受 ``mount`` (固有
    #   agent 文件 / daily_memory / agent_skills 通过 bind_mount 直接挂载, 沙箱
    #   内外实时同步)。
    # - ``JIUWENCLAW_SANDBOX_ENABLED`` 必须为 true 且 ``URL`` / ``TYPE`` 均非空时,
    #   才会构造沙箱 SysOperationCard; 否则回落到本地模式 (与不配置 sandbox 等价)。
    #
    # 下方占位 yaml 仅为旧用户视觉对照, 不会被读取 — 真正的取值请去 env 改。
    sandbox:
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_ENABLED]
      enabled: false
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_URL]
      url: http://127.0.0.1:8321
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_TYPE]
      type: jiuwenbox
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_STARTUP_MODE; 仅支持 external]
      startup_mode: external
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_PRESERVE_FILE_SHARING_MODE]
      preserve_file_sharing_mode: mount
      # [DEPRECATED — env: JIUWENCLAW_SANDBOX_EXCLUDED_COMMANDS]
      excluded_commands: []
      # 文件读写策略（host 上的路径会被 bind 进沙箱）:
      # - [DEPRECATED — env: JIUWENCLAW_SANDBOX_FILES_ALLOW] 每项为 path 字符串或
      #   {path, permissions} dict; 允许沙箱 rw 访问。
      # - [DEPRECATED — env: JIUWENCLAW_SANDBOX_FILES_DENY] 同上结构; 强制 ro,
      #   防止沙箱内 agent 写改（读不被屏蔽）。
      # jiuwenclaw 自己的 config.yaml 会自动作为 ro intrinsic 资源挂载, 无需显式列出。
      files:
        allow: []
        deny: []
kind: ConfigMap
metadata:
  name: jiuwenclaw-gateway-config
  namespace: jiuwenclaw
