apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-manager-web
  namespace: jiuwenclaw
  labels:
    app: jiuwenclaw-manager-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiuwenclaw-manager-web
  template:
    metadata:
      labels:
        app: jiuwenclaw-manager-web
    spec:
      containers:
        - name: manager-web
          image: <<MANAGER_WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5273
              protocol: TCP
          env:
            - name: MANAGER_WEB_HOST
              value: "0.0.0.0"
            - name: MANAGER_WEB_PORT
              value: "5273"
            - name: MANAGER_WEB_PROXY_TARGET
              value: "http://jiuwenclaw-manager-server:8765"
            - name: TZ
              value: "Asia/Shanghai"

---
# NodePort Service：供外连接 Manager Web UI
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-web-nodeport
  namespace: jiuwenclaw
spec:
  type: NodePort
  ports:
    - name: http
      port: 5273
      targetPort: 5273
      nodePort: <<MANAGER_WEB_NODE_PORT>>
  selector:
    app: jiuwenclaw-manager-web
