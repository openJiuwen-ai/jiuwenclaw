# Service：提供稳定 DNS 域名, 供集群内部访问
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-server
  namespace: jiuwenclaw
spec:
  selector:
    app: jiuwenclaw-manager-server
  ports:
    - name: rest
      port: 8765
      targetPort: 8765
    - name: websocket
      port: 8766
      targetPort: 8766
  type: ClusterIP # 集群内部访问，不需要外网
---
# NodePort Service：供集群外部连接
apiVersion: v1
kind: Service
metadata:
  name: jiuwenclaw-manager-server-nodeport
  namespace: jiuwenclaw
spec:
  type: NodePort
  ports:
    - name: rest
      port: 8765 # 集群内部端口
      targetPort: 8765 # 容器端口
      nodePort: <<MANAGER_SERVER_NODE_PORT>> # 外部访问端口（30000-32767）
  selector:
    app: jiuwenclaw-manager-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-manager-server
  namespace: jiuwenclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jiuwenclaw-manager-server
  template:
    metadata:
      labels:
        app: jiuwenclaw-manager-server
    spec:
      containers:
        - name: manager
          image: <<MANAGER_SERVER_IMAGE>>
          ports:
            - name: rest
              containerPort: 8765
            - name: websocket
              containerPort: 8766
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
          env:
            - name: MANAGER_RABBITMQ_URL
              value: ""
            - name: MANAGER_REST_HOST
              value: "0.0.0.0"
            - name: MANAGER_REST_PORT
              value: "8765"
            - name: MANAGER_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: MANAGER_SQLITE_PATH
              value: "manager.db"
            - name: MANAGER_DB_HOST
              value: "<<DB_HOST>>"
            - name: MANAGER_DB_PORT
              value: "<<DB_PORT>>"
            - name: MANAGER_DB_USER
              value: "<<DB_USER>>"
            - name: MANAGER_DB_NAME
              value: "manager"
            - name: MANAGER_WS_ENABLED
              value: "true"
            - name: MANAGER_WS_HOST
              value: "0.0.0.0"
            - name: MANAGER_WS_PORT
              value: "8766"
            - name: TZ
              value: "Asia/Shanghai"
            - name: MANAGER_PG_SCHEMA
              value: <<MANAGER_PG_SCHEMA>>
