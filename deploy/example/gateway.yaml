apiVersion: v1
kind: ServiceAccount
metadata:
  name: jiuwenclaw-gateway-sa
  namespace: jiuwenclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jiuwenclaw-agentserver-creator
  namespace: jiuwenclaw
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jiuwenclaw-gateway-agentserver-binding
  namespace: jiuwenclaw
subjects:
  - kind: ServiceAccount
    name: jiuwenclaw-gateway-sa
    namespace: jiuwenclaw
roleRef:
  kind: Role
  name: jiuwenclaw-agentserver-creator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiuwenclaw-gateway
  namespace: jiuwenclaw
  labels:
    app: jiuwenclaw-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jiuwenclaw-gateway
  template:
    metadata:
      labels:
        app: jiuwenclaw-gateway
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution: # 软限制：优先把pod分开部署，但如果资源紧张、只有一个节点可用的时候，也允许它们挤在同一台机器上
            - weight: 100 # 权重范围（1-100），取最高值，优先分开放置
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - jiuwenclaw-gateway
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: gateway
          image: <<GATEWAY_IMAGE>>
          imagePullPolicy: IfNotPresent
          # 用于调试模式：启用后容器将保持运行，可进入 Pod 手动调试程序
          # command: ["/bin/sh"]
          # args: ["-c", "sleep infinity"]
          envFrom:
            - secretRef:
                name: jiuwenclaw-secret-configmap
            - configMapRef:
                name: jiuwenclaw-gateway-env
          env:
            # downward API：注入当前 Pod 身份，供 RuntimeManagementAgentClient
            # 构建 agentserver pod 的 ownerReference（指向本 Pod），实现级联清理。
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: gateway-config
              mountPath: /root/.jiuwenclaw/config/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: gateway-config
          configMap:
            name: jiuwenclaw-gateway-config
            items:
              - key: config.yaml
                path: config.yaml
      serviceAccountName: jiuwenclaw-gateway-sa
