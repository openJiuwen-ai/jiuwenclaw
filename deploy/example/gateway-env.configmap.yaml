apiVersion: v1
data:
  AGENT_BOT_ID_GROUP_NUM: "0"
  AGENT_RUNTIME: jiuwen
  AGENT_SERVER_AUTOSCALE_INTERVAL: "5"
  AGENT_SERVER_CONFIGMAP_NAME: jiuwenclaw-gateway-config
  AGENT_SERVER_CONTAINER_NAME: jiuwenclaw-agentserver
  AGENT_SERVER_HOME: /home/app
  AGENT_SERVER_IMAGE: <<AGENT_SERVER_IMAGE>>
  AGENT_SERVER_IMAGE_PULL_POLICY: IfNotPresent
  AGENT_SERVER_MAX_SERVICES: "20"
  AGENT_SERVER_MESSAGE_TIMEOUT: "300"
  AGENT_SERVER_MIN_IDLE_SERVICES: "1"
  AGENT_SERVER_PORT: "18092"
  AGENT_SERVER_PORT_NAME: http1
  AGENT_SERVER_READINESS_INITIAL_DELAY: "5"
  AGENT_SERVER_READINESS_PERIOD: "10"
  AGENT_SERVER_READY_POLL_INTERVAL: "2"
  AGENT_SERVER_READY_TIMEOUT: "300"
  AGENT_SERVER_SERVICE_CONCURRENCY: "10"
  AGENT_SERVER_SERVICE_TTL: "180"
  AGENT_SERVER_SESSION_CONCURRENCY: "10"
  AGENT_SERVER_SESSION_TTL: "60"
  API_BASE: <<API_BASE>>
  CLAW_CODE_POD_PATH: /app/jiuwenclaw
  CLAW_MOUNT_TYPE: nfs
  CLAW_NFS_PATH: <<NFS_SHARE_PATH>>/jiuwenclaw
  CLAW_NFS_SERVER: <<NFS_SERVER_ADDR>>
  DEPLOYMENT_MODE: active-standby
  ENTERPRISE_WEB_ENABLED: "true"
  ENTERPRISE_WEB_GATEWAY_URL: ws://jiuwenclaw-web:19000/gateway
  EXTENSION_DIRS: /app/jiuwenclaw/packages/jiuwenclaw-ee/gateway/extensions
  GATEWAY_CLAW_WS_PING_INTERVAL: "20.0"
  GATEWAY_CLAW_WS_PING_TIMEOUT: "20.0"
  GATEWAY_DB_HOST: <<DB_HOST>>
  GATEWAY_DB_NAME: gateway
  GATEWAY_DB_PORT: <<DB_PORT>>
  GATEWAY_DB_TYPE: <<DB_TYPE>>
  GATEWAY_DB_USER: <<DB_USER>>
  GATEWAY_INSTANCE_ID: gateway-jiuwenclaw
  GATEWAY_MANAGER_WS_CLIENT_ENABLED: "true"
  GATEWAY_MANAGER_WS_HEARTBEAT_INTERVAL_SECONDS: "60"
  GATEWAY_MANAGER_WS_MAX_RECONNECT_ATTEMPTS: "3"
  GATEWAY_MANAGER_WS_PROBE_INTERVAL_SECONDS: "120"
  GATEWAY_MANAGER_WS_RECONNECT_INTERVAL_SECONDS: "3"
  GATEWAY_MANAGER_WS_URL: ws://jiuwenclaw-manager-server:8766
  GATEWAY_PG_SCHEMA: <<GATEWAY_PG_SCHEMA>>
  GATEWAY_SQLITE_PATH: gateway.db
  HEARTBEAT_ENABLED: "FALSE"
  JIUWENBOX_CODE_POD_PATH: /usr/local/lib/python3.11/site-packages/jiuwenbox
  JIUWENBOX_CONTAINER_NAME: jiuwenbox
  JIUWENBOX_ENABLED: "true"
  JIUWENBOX_IMAGE: <<JIUWENBOX_IMAGE>>
  JIUWENBOX_LISTEN: http://0.0.0.0:8321
  JIUWENBOX_MOUNT_CGROUP: "true"
  JIUWENBOX_POLICY_PATH: /usr/local/lib/python3.11/site-packages/jiuwenbox/configs/enterprise-policy.yaml
  JIUWENBOX_PORT: "8321"
  JIUWENBOX_SERVER_READINESS_INITIAL_DELAY: "5"
  JIUWENBOX_SERVER_READINESS_PERIOD: "10"
  JIUWENBOX_URL: http://127.0.0.1:8321
  LLM_SSL_VERIFY: "False"
  LOG_MASK_ENABLED: "true"
  LOG_ROOT_PATH: /root/.logs
  LOG_TO_FILE_ENABLED: "true"
  MODE: product
  MODEL_NAME: <<MODEL_NAME>>
  MODEL_PROVIDER: <<MODEL_PROVIDER>>
  NAMESPACE: jiuwenclaw
  REDIS_DB: "0"
  REDIS_HOST: <<REDIS_HOST>>
  REDIS_KEY_PREFIX: 'jiuwenclaw:'
  REDIS_MODE: standalone
  REDIS_PORT: <<REDIS_PORT>>
  RUNTIME_CODE_POD_PATH: /usr/local/lib/python3.11/site-packages/openjiuwen_runtime
  RUNTIME_DB_MAX_OVERFLOW: "20"
  RUNTIME_DB_POOL_SIZE: "2"
  RUNTIME_DB_POOL_TIMEOUT: "30"
  SYNC_CONFIG_ON_STARTUP: "FALSE"
  TOOL_RESULT_DISPLAY_MAX_CHARS: "500"
  TZ: Asia/Shanghai
  WEB_HOST: 0.0.0.0
kind: ConfigMap
metadata:
  name: jiuwenclaw-gateway-env
  namespace: jiuwenclaw
