apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<WEB_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<WEB_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<WEB_NAME>>
  template:
    metadata:
      labels:
        app: <<WEB_NAME>>
    spec:
      containers:
        - name: web
          image: <<WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
          env:
            - name: JIUWENCLAW_WEB_HOST
              value: "0.0.0.0"
            - name: JIUWENCLAW_WEB_PORT
              value: "5173"
            - name: JIUWENCLAW_WEB_PROXY_TARGET
              value: "http://<<GATEWAY_NAME>>:<<GATEWAY_WEBSOCKET_PORT>>"

---
# NodePort Service：供外连接
apiVersion: v1
kind: Service
metadata:
  name: <<WEB_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - port: 5173                    # 集群内部端口
      targetPort: 5173              # 容器端口
      nodePort: <<WEB_NODE_PORT>>   # 外部访问端口（30000-32767）
  selector:
    app: <<WEB_NAME>>