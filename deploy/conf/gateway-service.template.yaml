apiVersion: v1
kind: Service
metadata:
  name: <<GATEWAY_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<GATEWAY_NAME>>                     # 必须匹配你的 gateway pod 的标签
  ports:
    - name: websocket
      port: <<GATEWAY_WEBSOCKET_PORT>>         # Service 端口
      targetPort: <<GATEWAY_WEBSOCKET_PORT>>   # 容器端口
    - name: rest
      port: <<GATEWAY_REST_PORT>>             # Service 端口
      targetPort: <<GATEWAY_REST_PORT>>       # 容器端口
  type: ClusterIP                             # 集群内部访问，不需要外网

