apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<GATEWAY_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<GATEWAY_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<GATEWAY_NAME>>
  template:
    metadata:
      labels:
        app: <<GATEWAY_NAME>>
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gateway
          image: <<GATEWAY_PRODUCT_IMAGE>>
          imagePullPolicy: IfNotPresent
          # 用于调试模式：启用后容器将保持运行，可进入 Pod 手动调试程序
          # command: ["/bin/sh"]
          # args: ["-c", "sleep infinity"]
          ports:
            - name: websocket
              containerPort: <<GATEWAY_WEBSOCKET_PORT>>
              protocol: TCP
            - name: rest
              containerPort: <<GATEWAY_REST_PORT>>
              protocol: TCP
          envFrom: []
          volumeMounts:
            - name: gateway-config
              mountPath: /home/app/.jiuwenclaw/config/config.yaml
              subPath: config.yaml
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 2
              memory: <<GATEWAY_MEMORY>>Gi
            limits:
              cpu: 2
              memory: <<GATEWAY_MEMORY>>Gi
      volumes:
        - name: gateway-config
          configMap:
            name: <<GATEWAY_CONFIG_MAP_NAME>>
            items:
              - key: config.yaml
                path: config.yaml
