# Headless Service：给 StatefulSet 提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: <<CLAW_MANAGER_NAME>>-headless
  namespace: <<NAMESPACE>>
spec:
  ports:
    - port: <<MANAGER_REST_PORT>>
      targetPort: <<MANAGER_REST_PORT>>
  clusterIP: None  # 关键：无头服务，StatefulSet 必须依赖
  selector:
    app: <<CLAW_MANAGER_NAME>>

---
# NodePort Service：供外部连接 CLAW_MANAGER
apiVersion: v1
kind: Service
metadata:
  name: <<CLAW_MANAGER_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - port: <<MANAGER_REST_PORT>>       # 集群内部端口
      targetPort: <<MANAGER_REST_PORT>> # 容器端口
      nodePort: <<CLAW_MANAGER_NODE_PORT>>   # 外部访问端口（30000-32767）
  selector:
    app: <<CLAW_MANAGER_NAME>>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<CLAW_MANAGER_NAME>>
  namespace: <<NAMESPACE>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<CLAW_MANAGER_NAME>>
  template:
    metadata:
      labels:
        app: <<CLAW_MANAGER_NAME>>
    spec:
      containers:
      - name: manager
        image: <<CLAW_MANAGER_IMAGE>>
        ports:
        - containerPort: <<MANAGER_REST_PORT>>
        env:
        - name: MANAGER_RABBITMQ_URL
          value: "<<MANAGER_RABBITMQ_URL>>"
        - name: MANAGER_REST_PORT
          value: "<<MANAGER_REST_PORT>>"
        - name: MANAGER_DB_TYPE
          value: "<<MANAGER_DB_TYPE>>"
        - name: MANAGER_SQLITE_PATH
          value: "<<MANAGER_SQLITE_PATH>>"
        - name: MANAGER_DB_HOST
          value: "<<MANAGER_DB_HOST>>"
        - name: MANAGER_DB_PORT
          value: "<<MANAGER_DB_PORT>>"
        - name: MANAGER_DB_USER
          value: "root"
        - name: MANAGER_DB_PASSWORD
          value: "<<MANAGER_DB_PASSWORD>>"
        - name: MANAGER_DB_NAME
          value: "<<MANAGER_DB_NAME>>"
