apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<JINA_NAME>>-reader
  labels:
    app: <<JINA_NAME>>-reader
    component: crawler
    env: production
spec:
  replicas: <<JINA_READER_NUM>>
  selector:
    matchLabels:
      app: <<JINA_NAME>>-reader
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: <<JINA_NAME>>-reader
        component: crawler
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: <<JINA_NAME>>-reader
        image: <<JINA_READER_IMAGE>>
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
        ports:
        - containerPort: 8080
          name: http2
        - containerPort: 8081
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 8
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 8
          failureThreshold: 3
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
        lifecycle:
          preStop:
            exec:
              command: ["sh", "-c", "sleep 10"]
      volumes:
      - name: tmp-volume
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: ["<<JINA_NAME>>-reader"]
              topologyKey: "kubernetes.io/hostname"
---
apiVersion: v1
kind: Service
metadata:
  name: <<JINA_NAME>>-reader-svc
  labels:
    app: <<JINA_NAME>>-reader
    component: crawler
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: <<JINA_NAME>>-reader

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: <<JINA_NAME>>-nginx-config
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log notice;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # 定义缓存路径、目录层级、共享内存大小(10m)、最大磁盘占用(1g)、缓存过期时间
        proxy_cache_path /var/cache/nginx/jina_levelslevels=1:2 keys_zone=jina_cache:10m max_size=1g inactive=60m use_temp_path=off;

        upstream jina_backend {
            server <<JINA_NAME>>-reader-svc:80;
        }

        server {
            listen 80;
            server_name localhost;

            # 增加超时限制，防止后端 Jina 抓取慢时 Nginx 提前断开
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            location / {
                proxy_pass http://jina_backend;
                
                # 开启缓存
                proxy_cache jina_cache;
                
                # 缓存 Key：包含请求的整个 URI（即目标网页的 URL）
                proxy_cache_key "$scheme$request_method$request_uri";

                # 强行无视后端的 Vary 以及反缓存头部
                proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
                
                # 强行对内隐藏 Vary 和 Set-Cookie，不让 Nginx 的缓存引擎看到它们
                proxy_hide_header Vary;
                proxy_hide_header Set-Cookie;

                # 只有当 Jina 返回 200 或 302 时才缓存
                # 规则 1：如果 URL 包含 live, score, stock, tianqi, weather，缓存 3 分钟
                location ~* (live|score|stock|tianqi|weather) {
                    proxy_pass http://jina_backend;
                    proxy_cache_valid 200 302 3m;
                }

                # 规则 2：如果 URL 包含 wiki, archive, history，缓存 7 天
                location ~* (wiki|archive|history) {
                    proxy_pass http://jina_backend;
                    proxy_cache_valid 200 302 7d;
                }

                # 规则 3：默认兜底策略，其他所有网页缓存 1 小时
                location / {
                    proxy_pass http://jina_backend;
                    proxy_cache_valid 200 302 1h;
                }
                
                # 如果 Jina 返回 404 或 500 等错误，不缓存
                proxy_cache_valid 404 500 502 503 504 0s;

                # 允许同时只有一个请求去后端抓取同一个 URL，其余相同请求等待，防止暴击后端
                proxy_cache_lock on;
                proxy_cache_lock_timeout 5s;

                # 在 Header 中添加缓存命中状态（HIT/MISS），方便我们调试测试
                add_header X-Cache-Status $upstream_cache_status;

                # 传递必要的 Host 头部
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<JINA_NAME>>-cache-proxy
  labels:
    app: <<JINA_NAME>>-cache-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<JINA_NAME>>-cache-proxy
  template:
    metadata:
      labels:
        app: <<JINA_NAME>>-cache-proxy
    spec:
      containers:
      - name: <<JINA_NAME>>-cache-proxy
        image: <<JINA_CACHE_IMAGE>>
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: cache-volume
          mountPath: /var/cache/nginx/jina_levels
      volumes:
      - name: config-volume
        configMap:
          name: <<JINA_NAME>>-nginx-config
      - name: cache-volume
        emptyDir: {} # 缓存文件临时存放在内存/宿主机磁盘，Pod 重启会清空

---
apiVersion: v1
kind: Service
metadata:
  name: <<JINA_NAME>>-cache-proxy-svc
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: <<JINA_NAME>>-cache-proxy
