# 统一前端 webui + 认证中心 identity(同一模块,随部署一起启动)。
#   - identity：OAuth2 + RS256 JWT，独立身份库，仅集群内访问(ClusterIP)。
#   - webui：nginx + SPA，对外唯一入口(NodePort)，经 /idp 反代到 identity。
# 后端 upstream(BACKEND_*)由环境变量注入，指向集群内 Service。

# ---------- 认证中心 identity（ClusterIP，不对外） ----------
apiVersion: v1
kind: Service
metadata:
  name: <<IDENTITY_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<IDENTITY_NAME>>
  ports:
    - name: rest
      port: <<IDENTITY_PORT>>
      targetPort: <<IDENTITY_PORT>>
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<IDENTITY_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<IDENTITY_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<IDENTITY_NAME>>
  template:
    metadata:
      labels:
        app: <<IDENTITY_NAME>>
    spec:
      containers:
        - name: identity
          image: <<IDENTITY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: rest
              containerPort: <<IDENTITY_PORT>>
          env:
            - name: IDENTITY_REST_HOST
              value: "0.0.0.0"
            - name: IDENTITY_REST_PORT
              value: "<<IDENTITY_PORT>>"
            # 独立身份库(与管理库物理分开;DB_NAME 用 identity,JWT 签名密钥落此库)
            - name: IDENTITY_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: IDENTITY_SQLITE_PATH
              value: "<<IDENTITY_SQLITE_PATH>>"
            - name: IDENTITY_DB_HOST
              value: "<<DB_HOST>>"
            - name: IDENTITY_DB_PORT
              value: "<<DB_PORT>>"
            - name: IDENTITY_DB_USER
              value: "<<IDENTITY_DB_USER>>"
            - name: IDENTITY_DB_PASSWORD
              value: "<<IDENTITY_DB_PASSWORD>>"
            - name: IDENTITY_DB_NAME
              value: "<<IDENTITY_DB_NAME>>"
            - name: IDENTITY_PG_SCHEMA
              value: "<<IDENTITY_PG_SCHEMA>>"
            - name: IDENTITY_JWT_ISSUER
              value: "<<IDENTITY_JWT_ISSUER>>"
            - name: IDENTITY_JWT_AUDIENCE
              value: "<<IDENTITY_JWT_AUDIENCE>>"

---
# ---------- 统一前端 webui（NodePort，对外唯一入口） ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<WEBUI_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<WEBUI_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<WEBUI_NAME>>
  template:
    metadata:
      labels:
        app: <<WEBUI_NAME>>
    spec:
      containers:
        - name: webui
          image: <<WEBUI_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # nginx 同一份模板,upstream 经环境注入(指向集群内 Service)。
          env:
            - name: NGINX_ENVSUBST_FILTER
              value: "^BACKEND_"
            - name: BACKEND_API
              value: "http://<<MANAGER_SERVER_NAME>>:<<MANAGER_REST_PORT>>"
            - name: BACKEND_IDP
              value: "http://<<IDENTITY_NAME>>:<<IDENTITY_PORT>>"
            - name: BACKEND_WS
              value: "http://<<WEB_NAME>>:<<ENTERPRISE_WEB_WS_PORT>>"

---
# 唯一对外入口:NodePort(端口由 deploy/ports_handler.sh 在 30000-32767 自动分配避冲突)。
# 其余后端服务全部 ClusterIP 内网,不再对外暴露。
apiVersion: v1
kind: Service
metadata:
  name: <<WEBUI_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: <<WEBUI_NODE_PORT>>
  selector:
    app: <<WEBUI_NAME>>
