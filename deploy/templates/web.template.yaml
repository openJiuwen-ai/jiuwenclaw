apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<WEB_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<WEB_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<WEB_NAME>>
  template:
    metadata:
      labels:
        app: <<WEB_NAME>>
    spec:
      containers:
        - name: web
          image: <<WEB_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5173
              protocol: TCP
            - name: websocket
              containerPort: <<ENTERPRISE_WEB_WS_PORT>>
              protocol: TCP
          env:
            - name: JIUWENCLAW_WEB_HOST
              value: "0.0.0.0"
            - name: JIUWENCLAW_WEB_PORT
              value: "5173"
            - name: ENTERPRISE_WEB_WS_HOST
              value: "0.0.0.0"
            - name: ENTERPRISE_WEB_WS_PORT
              value: "<<ENTERPRISE_WEB_WS_PORT>>"
            - name: WS_ORIGIN_CHECK_ENABLED
              value: "false"
            - name: TZ
              value: "<<TIMEZONE>>"
            # 文件上传 /file-api/upload-obs 写 MinIO(infra 在 default 命名空间,跨 ns 用 .default)
            - name: JIUWENCLAW_MINIO_ENDPOINT
              value: "<<MINIO_NAME>>-headless.default:9000"
            - name: JIUWENCLAW_MINIO_ACCESS_KEY
              value: "<<MINIO_ROOT_USER>>"
            - name: JIUWENCLAW_MINIO_SECRET_KEY
              value: "<<MINIO_ROOT_PASSWORD>>"
            - name: JIUWENCLAW_MINIO_BUCKET
              value: "<<OBS_BUCKET>>"
            - name: JIUWENCLAW_MINIO_SECURE
              value: "<<MINIO_SECURE>>"
            - name: JIUWENCLAW_MINIO_REGION
              value: "<<MINIO_REGION>>"
            - name: JIUWENCLAW_MINIO_PUBLIC_BASE_URL
              value: "<<OBS_PUBLIC_BASE_URL>>"

---
# 集群内部访问： 提供稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: <<WEB_NAME>>
  namespace: <<NAMESPACE>>
spec:
  selector:
    app: <<WEB_NAME>>
  ports:
    - name: websocket
      port: <<ENTERPRISE_WEB_WS_PORT>>         # Service 端口
      targetPort: <<ENTERPRISE_WEB_WS_PORT>>   # 容器端口
  type: ClusterIP                             # 集群内部访问，不需要外网

---
# NodePort Service：供外连接
apiVersion: v1
kind: Service
metadata:
  name: <<WEB_NAME>>-nodeport
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - port: 5173                    # 集群内部端口
      targetPort: 5173              # 容器端口
      nodePort: <<WEB_NODE_PORT>>   # 外部访问端口（30000-32767）
  selector:
    app: <<WEB_NAME>>
