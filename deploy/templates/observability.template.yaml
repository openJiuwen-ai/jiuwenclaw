apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<OBSERVABILITY_NAME>>
  namespace: <<NAMESPACE>>
  labels:
    app: <<OBSERVABILITY_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<OBSERVABILITY_NAME>>
  template:
    metadata:
      labels:
        app: <<OBSERVABILITY_NAME>>
    spec:
      enableServiceLinks: false
      containers:
        - name: <<OBSERVABILITY_NAME>>
          image: <<OBSERVABILITY_IMAGE>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5274
              protocol: TCP
          env:
            - name: OBSERVABILITY_DB_TYPE
              value: "<<DB_TYPE>>"
            - name: OBSERVABILITY_DB_HOST
              value: "<<DB_HOST>>"
            - name: OBSERVABILITY_DB_PORT
              value: "<<DB_PORT>>"
            - name: OBSERVABILITY_DB_USER
              value: "<<OBSERVABILITY_DB_USER>>"
            - name: OBSERVABILITY_DB_PASSWORD
              value: "<<OBSERVABILITY_DB_PASSWORD>>" 
            - name: OBSERVABILITY_DB_NAME
              value: "<<OBSERVABILITY_DB_NAME>>"
            - name: OBSERVABILITY_HOST
              value: "0.0.0.0"
            - name: OBSERVABILITY_PORT
              value: "5274"
            - name: OBSERVABILITY_PROMETHEUS_URL
              value: "<<PROMETHEUS_URL>>"
            - name: OBSERVABILITY_TEMPO_URL
              value: "<<TEMPO_URL>>"
            - name: OBSERVABILITY_LOKI_URL
              value: "<<LOKI_URL>>/loki"
            - name: OBSERVABILITY_LOG_LEVEL
              value: "debug"
            - name: TZ
              value: "<<TIMEZONE>>"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: <<OBSERVABILITY_NAME>>
  namespace: <<NAMESPACE>>
spec:
  type: NodePort
  ports:
    - name: http
      port: 5274
      targetPort: 5274
      nodePort: <<OBSERVABILITY_NODE_PORT>>
  selector:
    app: <<OBSERVABILITY_NAME>>
