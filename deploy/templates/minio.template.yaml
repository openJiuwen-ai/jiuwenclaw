# Headless Service：给 StatefulSet 提供集群内部稳定 DNS 域名
apiVersion: v1
kind: Service
metadata:
  name: <<MINIO_NAME>>-headless
  namespace: default
spec:
  clusterIP: None
  ports:
    - name: minio-api
      port: 9000
      targetPort: 9000
    - name: minio-console
      port: 9001
      targetPort: 9001
  selector:
    app: <<MINIO_NAME>>

---
# NodePort Service：供外部连接
apiVersion: v1
kind: Service
metadata:
  name: <<MINIO_NAME>>-nodeport
  namespace: default
spec:
  type: NodePort
  ports:
    - name: minio-api
      port: 9000
      targetPort: 9000
      nodePort: <<MINIO_API_NODE_PORT>>  # 外部代码/SDK 连接的 API 端口
    - name: minio-console
      port: 9001
      targetPort: 9001
      nodePort: <<MINIO_CONSOLE_NODE_PORT>>  # 外部浏览器访问的管理后台端口
  selector:
    app: <<MINIO_NAME>>

---
# StatefulSet：MinIO 有状态服务主体
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: <<MINIO_NAME>>
  namespace: default
spec:
  serviceName: <<MINIO_NAME>>-headless
  replicas: 1
  selector:
    matchLabels:
      app: <<MINIO_NAME>>
  template:
    metadata:
      labels:
        app: <<MINIO_NAME>>
    spec:
      containers:
        - name: <<MINIO_NAME>>
          image: <<MINIO_IMAGE>>
          args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              value: "<<MINIO_ROOT_USER>>"     
            - name: MINIO_ROOT_PASSWORD
              value: "<<MINIO_ROOT_PASSWORD>>"
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - containerPort: 9000
              name: minio-api
            - containerPort: 9001
              name: minio-console
          volumeMounts:
            - name: minio-storage
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: <<MINIO_NAME>>-pvc

---
# PV 持久化存储
apiVersion: v1
kind: PersistentVolume
metadata:
  name: <<MINIO_NAME>>-pv
  labels:
    app: <<MINIO_NAME>>
spec:
  capacity:
    storage: <<MINIO_STORAGE_SIZE>>
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: <<NFS_SERVER_ADDR>>   
    path: <<MINIO_NFS_PATH>>                  
    readOnly: false
  mountOptions:
    - nfsvers=4
    - soft        # 改成 soft！防止节点卡死
    - timeo=600   # 超时时间：60秒
    - retrans=2   # 重试2次
    - noatime

---
# PVC 持久化存储
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: <<MINIO_NAME>>-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: <<MINIO_STORAGE_SIZE>>
  storageClassName: ""
  selector:
    matchLabels:
      app: <<MINIO_NAME>>
