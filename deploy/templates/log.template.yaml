# Fluent Bit：跑在每台 K8s 节点，从宿主机抓取容器原始日志、简单清洗、转发出去
# Vector：接收所有节点 Fluent Bit 推送的日志，承担**复杂清洗、脱敏、分流、存储、告警等重逻辑。

apiVersion: v1
kind: ConfigMap
metadata:
  name: <<FLUENT_BIT_NAME>>-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        # 源头过滤：只采集满足命名空间和 Pod 前缀的文件，极大减少节点无效 IO
        Path              /var/log/pods/*_jiuwenclaw*/*/*.log
        Parser            cri_or_docker
        DB                /var/lib/fluent-bit/positions.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.pods.
        Regex_Parser        k8s-custom-tag
        Merge_Log           On
        Keep_Log            Off

    [OUTPUT]
        Name          forward
        Match         *
        Host          <<VECTOR_NAME>>
        Port          9000

  parsers.conf: |
    # 自动兼容新版 K8s (Containerd/CRI) 和 旧版 K8s (Docker) 的日志格式
    [PARSER]
        Name        cri_or_docker
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<flags>[^ ]+) (?<message>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    # 专门用来把不规范的局部 Tag 还原成 K8s 过滤器能看懂的元数据
    [PARSER]
        Name        k8s-custom-tag
        Format      regex
        Regex       ^(?<namespace>[^_]+)_(?<pod_name>[^_]+)_(?<pod_id>[a-z0-9-]+)\.(?<container_name>[^.]+)\.(?<log_file_name>.*)$

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: <<FLUENT_BIT_NAME>>

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: <<FLUENT_BIT_NAME>>
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: <<FLUENT_BIT_NAME>>
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: <<FLUENT_BIT_NAME>>
subjects:
  - kind: ServiceAccount
    name: <<FLUENT_BIT_NAME>>
    namespace: default

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: <<FLUENT_BIT_NAME>>
spec:
  selector:
    matchLabels:
      app: <<FLUENT_BIT_NAME>>
  template:
    metadata:
      labels:
        app: <<FLUENT_BIT_NAME>>
    spec:
      serviceAccountName: <<FLUENT_BIT_NAME>>
      tolerations:
        - operator: Exists # 确保每个节点（包括 Master）都跑一个采集 Agent
          effect: NoSchedule
      containers:
        - name: <<FLUENT_BIT_NAME>>
          image: <<FLUENT_BIT_IMAGE>>
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions-db
              mountPath: /var/lib/fluent-bit
      volumes:
        - name: config
          configMap:
            name: <<FLUENT_BIT_NAME>>-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: positions-db
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate   # 宿主机没有就自动建

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: <<VECTOR_NAME>>-config
data:
  vector.yaml: |
    sources:
      fluent_bit_in:
        type: fluent
        address: 0.0.0.0:9000

    transforms:
      filter_and_parse:
        type: remap
        inputs: ["fluent_bit_in"]
        source: |
          # 1. 获取 Fluent Bit 传过来的原始 Tag 字段 (路径已被转为点分格式)
          raw_tag = .tag || ""

          # 2. 精准捕获 jiuwenclaw-\* 格式的 Pod 名字
          captures = parse_regex(raw_tag, r'^kube\.var\.log\.pods\.(?<ns>[^_]+)_(?<pod>jiuwenclaw-.+?)_(?<uid>[^.]+)\.(?<container>[^.]+)\.') ?? null
          if captures == null {
            # 如果不匹配，说明不是我们想要的业务日志，直接丢弃
            abort
          }

          # 3. 提取出干净的元数据标签
          .ns = captures.ns
          .pod = captures.pod
          .container = captures.container

          # 4. 获取真实的明文日志内容
          # Fluent Bit 经过 Filter 后的明文在 .message 中；如果没有，则取原始容器输出 .log
          .message = .message || .log || ""

      # ================================================================
      # 脱敏 transform：复刻 jiuwenclaw/infrastructure/log_masking/engine.py
      # 的 4 条内置规则（按 priority DESC 顺序应用）。
      # DEFAULT_REPLACEMENT = "******"
      #
      # 注意：VRL replace 使用 Rust regex crate，不支持 lookbehind/lookahead，
      # 故用 \b（word boundary）替代 (?<!\d) / (?!\d)。
      # 模式中的字面量 " 和 ' 用 \x22 / \x27 代替，避免 raw string 冲突。
      # ================================================================
      mask_sensitive:
        type: remap
        inputs: ["filter_and_parse"]
        source: |
          msg = to_string(.message) ?? ""
          if msg != "" {
            # 1. 邮箱 (priority 40)
            msg = replace(msg, r'\b[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}\b', "******")

            # 2. 手机号 (priority 30) — 原始 Python 正则用了 (?<!\d) 和 (?!\d)，
            #    Rust regex 不支持 lookaround，拆成两条用 \b 替代：
            #    (a) 带 +86 前缀：+ 号天然充当左边界
            #    (b) 裸 11 位号码：\b 确保前后非数字
            msg = replace(msg, r'\+86[-\s]?1[3-9]\d{9}\b', "******")
            msg = replace(msg, r'\b1[3-9]\d{9}\b', "******")

            # 3. 身份证号 (priority 20) — 18 位，数字和 X/x 均为 word char，\b 等效
            msg = replace(msg, r'\b\d{17}[\dXx]\b', "******")

            # 4. 敏感 KV (priority 10) — key=value 中的 value 脱敏，key 保留。
            #    敏感 key：password / passwd / pwd / secret / token / api_key /
            #    access_token / refresh_token / authorization / credential /
            #    private_key / user_id（(?i) 大小写不敏感）
            msg = replace(msg, r'(?i)([\x22\x27]?[\w.-]*(?:password|passwd|pwd|secret|token|api[_-]?key|access[_-]?token|refresh[_-]?token|authorization|credential|private[_-]?key|user[_-]?id)[\w.-]*[\x22\x27]?\s*[:=]\s*)(\x22[^\x22]*\x22|\x27[^\x27]*\x27|[^,\s\x22\x27\}\]]+)', "$${1}******")

            .message = msg
          }

    sinks:
      file_out:
        type: file
        # LOG_SINK_INPUT：mask_sensitive（脱敏后落盘）、filter_and_parse（跳过脱敏，直接落盘）
        inputs: ["<<LOG_SINK_INPUT>>"]
        # path 支持 Vector 模板语法，用 %Y-%m-%d 按天切分文件（官方推荐做法）。
        path: "/master-logs/{{ ns }}/{{ pod }}/{{ container }}-%Y-%m-%d.log"
        encoding:
          # 将上面提取的纯日志文本写入文件，不要任何 JSON 杂质
          codec: raw_message

        acknowledgements:
          enabled: true

        # 文件闲置 600 秒无新事件后自动 flush 并关闭句柄
        idle_timeout_secs: 600

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: <<VECTOR_NAME>>
spec:
  replicas: 1
  selector:
    matchLabels:
      app: <<VECTOR_NAME>>
  template:
    metadata:
      labels:
        app: <<VECTOR_NAME>>
    spec:
      # 固定调度到本master节点（运行部署工具的节点）
      nodeName: <<MASTER_NODE_NAME>>
      containers:
        - name: <<VECTOR_NAME>>
          image: <<VECTOR_IMAGE>>
          args: ["--config-dir", "/etc/vector"]
          ports:
            - containerPort: 9000
              name: fluent-port
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: master-store
              mountPath: /master-logs
      volumes:
        - name: config
          configMap:
            name: <<VECTOR_NAME>>-config
        - name: master-store
          hostPath:
            path: <<CLAW_LOG_DIR>> # 映射到 Master 宿主机物理目录

---
apiVersion: v1
kind: Service
metadata:
  name: <<VECTOR_NAME>>
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: <<VECTOR_NAME>>
