[project]
name = "jiuwenclaw-observability"
version = "0.1.0"
description = "JiuwenClaw Observability Web — static dist + Prometheus relay"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.scripts]
jiuwenclaw-observability = "jiuwenclaw_observability.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
